    <style>
        /* Base styles and camera background */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            touch-action: manipulation; /* Preserve touch interactions without disabling zoom. */
        }
        
        #camera-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0; /* Never put the video behind the black document background. */
            opacity: 0;
            transition: opacity .3s ease;
            pointer-events: none;
            transform: scaleX(-1); /* Keep front-camera mirror effect. */
        }
        #camera-bg.camera-ready { opacity: 1;
        }

        /* Glassmorphism UI Effects */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .compass-container {
            position: relative;
            width: min(320px, 88vw, 48dvh);
            height: auto;
            aspect-ratio: 1;
            flex: none;
            margin: 0 auto;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.4);
        }

        .compass-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .direction-point {
            position: absolute;
            transform: translate(-50%, -50%);
            width: min(70px, 20%);
            aspect-ratio: 1;
            height: auto;
            padding: 0;
            font: inherit;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .direction-point:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        @media (min-width: 768px) {
            .compass-container { width: min(480px, 80vw, 60dvh); }
        }

        .direction-point:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        .direction-point.visible {
            background: rgba(255, 255, 255, 0.85);
            color: #1f2937;
            border: 2px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .direction-point.hidden-state {
            background: rgba(31, 41, 55, 0.7);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
        }

        .direction-point.listening {
            animation: pulse-ring 1s infinite;
            background: rgba(59, 130, 246, 0.8);
            border-color: #60a5fa;
        }
        
        .direction-point.error {
            animation: shake 0.4s ease-in-out;
            background: rgba(239, 68, 68, 0.8);
            border-color: #fca5a5;
        }

        .direction-point.success {
            background: rgba(34, 197, 94, 0.8);
            border-color: #86efac;
            color: white;
        }

        /* Animations */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) translateX(0); }
            20%, 60% { transform: translate(-50%, -50%) translateX(-5px); }
            40%, 80% { transform: translate(-50%, -50%) translateX(5px); }
        }

        /* Toast message */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(10px);
        }

        /* Compass Rotation specific styles */
        #compass {
            will-change: transform;
            touch-action: none; /* Crucial for manual drag on mobile */
            cursor: grab;
        }
        #compass:active {
            cursor: grabbing;
        }
        .direction-point {
            will-change: transform;
        }

        #game-ui { z-index: 1; }
        [hidden] { display: none !important; }
        #device-status { text-shadow: 0 1px 4px #000; }
        #device-status .device-line { margin-top: .3rem; }
        #device-status button, #answer-modal button {
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,.5);
            padding: .3rem .65rem;
            background: rgba(20, 45, 90, .85);
            color: white;
            font-weight: 650;
            margin-left: .35rem;
        }
        #answer-modal {
            position: fixed; inset: 0; z-index: 80;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem; background: rgba(0,0,0,.8);
        }
        #answer-modal .answer-card { width: min(100%, 350px); padding: 1.5rem; }
        #answer-input {
            width: 100%; font-size: 1rem; color: #111827; background: #fff;
            border-radius: .7rem; padding: .75rem; margin: .8rem 0;
        }
        #answer-feedback { min-height: 1.5rem; font-size: .85rem; }
        @media (prefers-reduced-motion: reduce) {
            #camera-bg { transition: none; }
        }

        /* Keep the two sets of controls usable on narrow phones. */
        #controls-header { gap: 8px; }
        #hide-btn { white-space: nowrap; }
        @media (max-width: 360px) {
            .compact-english { display: none; }
            #settings-panel { padding: .6rem; gap: .5rem; }
            #settings-panel .flex.items-center { gap: .35rem; }
            #settings-panel label { white-space: nowrap; }
            #lang-select { max-width: 115px; }
            #hide-actions { padding: .35rem; gap: .3rem; }
            #hide-btn { padding: .2rem .35rem; }
        }

        /* Start Screen Overlay */
        #start-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.5s;
        }
    </style>

    <script>
        // Camera playback may fail on iPad even after getUserMedia permission succeeds.
        // Keep capture, video playback, and visibility as separate observable states.
        const cameraVideo = document.getElementById('camera-bg');
        const cameraStatus = document.getElementById('camera-status');
        const retryCameraBtn = document.getElementById('retry-camera-btn');
        const speechStatus = document.getElementById('speech-status');
        let cameraStream = null;
        let cameraStarting = false;
        let cameraReadyTimer = null;

        function setCameraStatus(message, showRetry = false) {
            cameraStatus.textContent = `相機：${message}`;
            retryCameraBtn.hidden = !showRetry;
        }
        function setSpeechStatus(message) {
            speechStatus.textContent = `語音：${message}`;
        }
        function stopCamera() {
            clearTimeout(cameraReadyTimer);
            cameraReadyTimer = null;
            cameraVideo.classList.remove('camera-ready');
            cameraVideo.pause();
            cameraVideo.srcObject = null;
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }
        function cameraFrameReady() {
            if (cameraVideo.srcObject && cameraVideo.readyState >= 2 &&
                cameraVideo.videoWidth > 0 && cameraVideo.videoHeight > 0) {
                clearTimeout(cameraReadyTimer);
                cameraReadyTimer = null;
                cameraVideo.classList.add('camera-ready');
                setCameraStatus('播放中');
            }
        }
        cameraVideo.addEventListener('playing', cameraFrameReady);
        cameraVideo.addEventListener('loadeddata', cameraFrameReady);
        cameraVideo.addEventListener('resize', cameraFrameReady);
        cameraVideo.addEventListener('error', () => {
            setCameraStatus('影片播放錯誤，請按重試', true);
        });

        async function initCamera() {
            if (cameraStarting) return;
            cameraStarting = true;
            stopCamera();
            setCameraStatus('正在要求相機權限…');
            if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
                setCameraStatus('需要 HTTPS 及支援相機的瀏覽器', true);
                cameraStarting = false;
                return;
            }
            try {
                // A preference, not a hard constraint, so missing front cameras can fall back.
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false, video: { facingMode: { ideal: 'user' } }
                });
                cameraStream = stream;
                const track = stream.getVideoTracks()[0];
                if (track) track.addEventListener('ended', () => {
                    cameraVideo.classList.remove('camera-ready');
                    setCameraStatus('鏡頭已停止，請按重試', true);
                });
                cameraVideo.muted = true;
                cameraVideo.defaultMuted = true;
                cameraVideo.playsInline = true;
                cameraVideo.setAttribute('playsinline', '');
                cameraVideo.setAttribute('webkit-playsinline', '');
                cameraVideo.srcObject = stream;
                setCameraStatus('已授權，正在啟動畫面…');
                // Set a timeout before awaiting play(); some WebKit players never settle.
                cameraReadyTimer = setTimeout(() => {
                    if (!cameraVideo.classList.contains('camera-ready')) {
                        setCameraStatus('已授權但沒有畫面，請按重試', true);
                    }
                }, 4000);
                // Safari's play() may reject; never hide the error.
                const playResult = cameraVideo.play();
                if (playResult?.then) await playResult;
                cameraFrameReady();
            } catch (err) {
                console.warn('Camera start failure:', err);
                const reason = err?.name === 'NotAllowedError' ? '相機被拒絕或影片被阻擋'
                    : err?.name === 'NotFoundError' ? '沒有找到相機'
                    : err?.name === 'NotReadableError' ? '相機被其他程式佔用'
                    : `無法啟動（${err?.name || 'unknown'}）`;
                setCameraStatus(reason, true);
            } finally {
                cameraStarting = false;
            }
        }
        retryCameraBtn.addEventListener('click', () => {
            // Playing an existing stream synchronously inside the tap can bypass
            // iPad's loss of user activation while waiting for getUserMedia().
            if (cameraStream?.getVideoTracks().some(track => track.readyState === 'live')) {
                setCameraStatus('正在重新播放…');
                clearTimeout(cameraReadyTimer);
                cameraReadyTimer = setTimeout(() => {
                    if (!cameraVideo.classList.contains('camera-ready')) {
                        setCameraStatus('仍然沒有畫面，可再次重試', true);
                    }
                }, 4000);
                try {
                    const result = cameraVideo.play();
                    if (result?.catch) result.catch(err => {
                        console.warn('Camera replay failed:', err);
                        setCameraStatus(`影片無法播放（${err?.name || 'unknown'}）`, true);
                    });
                } catch (err) {
                    setCameraStatus(`影片無法播放（${err?.name || 'unknown'}）`, true);
                }
                cameraFrameReady();
            } else {
                initCamera();
            }
        });

        const directions = [
            { id: 'N', name: '北', en: 'N', angle: -90 },
            { id: 'NE', name: '東北', en: 'NE', angle: -45 },
            { id: 'E', name: '東', en: 'E', angle: 0 },
            { id: 'SE', name: '東南', en: 'SE', angle: 45 },
            { id: 'S', name: '南', en: 'S', angle: 90 },
            { id: 'SW', name: '西南', en: 'SW', angle: 135 },
            { id: 'W', name: '西', en: 'W', angle: 180 },
            { id: 'NW', name: '西北', en: 'NW', angle: 225 }
        ];

        const compassEl = document.getElementById('compass');
        const voiceBtn = document.getElementById('toggle-voice-btn');
        const gyroBtn = document.getElementById('toggle-gyro-btn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if (recognition) {
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        }

        let voiceMode = Boolean(recognition);
        let typeMode = !recognition; // Unsupported speech still allows guessing, not just reveal.
        let voiceWatchdog = null;
        let isListening = false;
        let activeChallenge = null;
        let challengeTimer = null;
        let toastTimer = null;
        let compassRotation = 0;
        let isDragging = false;
        let hasDragged = false;
        let previousDragAngle = 0;
        let dragTravel = 0;
        let dragResetTimer = null;
        let gyroMode = false;
        let gyroReadTimer = null;
        let gyroHasReading = false;
        let started = false;

        function directionById(dirId) {
            return directions.find(d => d.id === dirId);
        }

        function setDirectionHidden(dirId, element) {
            // Always rebuild the contents. The previous markup may be just '?' (voice off).
            element.classList.remove('visible', 'listening', 'error', 'success');
            element.classList.add('hidden-state');
            element.setAttribute('aria-label', voiceMode
                ? '隱藏方向：按下後用語音回答'
                : typeMode ? '隱藏方向：按下後輸入答案' : '隱藏方向：按下後顯示答案');
            element.innerHTML = voiceMode
                ? `<svg aria-hidden="true" class="w-6 h-6 dir-icon-mic text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>`
                : '<span class="text-2xl font-bold" aria-hidden="true">?</span>';
        }

        function setDirectionVisible(dirId, element) {
            const dir = directionById(dirId);
            element.classList.remove('hidden-state', 'listening', 'error', 'success');
            element.classList.add('visible');
            element.setAttribute('aria-label', `${dir.name} (${dir.en})：按下後隱藏`);
            element.innerHTML = `
                <span class="text-xl font-bold dir-text-zh text-gray-800">${dir.name}</span>
                <span class="text-xs font-medium dir-text-en text-gray-500">${dir.en}</span>
            `;
        }

        function initCompass() {
            directions.forEach(dir => {
                const element = document.createElement('button');
                element.type = 'button';
                element.className = 'direction-point';
                element.id = `dir-${dir.id}`;
                const angle = dir.angle * Math.PI / 180;
                element.style.left = `${50 + Math.cos(angle) * 40}%`;
                element.style.top = `${50 + Math.sin(angle) * 40}%`;
                element.style.transform = `translate(-50%, -50%) rotate(${-compassRotation}deg)`;
                setDirectionVisible(dir.id, element);
                element.addEventListener('click', () => handleDirectionClick(dir.id, element));
                compassEl.appendChild(element);
            });
        }

        function handleDirectionClick(dirId, element) {
            if (isListening || hasDragged) return;
            if (element.classList.contains('visible')) {
                setDirectionHidden(dirId, element);
            } else if (voiceMode && recognition) {
                startVoiceChallenge(dirId, element);
            } else if (typeMode) {
                openAnswerModal(dirId);
            } else {
                setDirectionVisible(dirId, element);
            }
        }

        function finishChallenge(challenge) {
            if (activeChallenge !== challenge) return;
            clearTimeout(challengeTimer);
            clearTimeout(voiceWatchdog);
            challengeTimer = null;
            voiceWatchdog = null;
            activeChallenge = null;
            isListening = false;
        }

        function cancelVoiceChallenge() {
            const challenge = activeChallenge;
            if (!challenge) return;
            clearTimeout(challengeTimer);
            clearTimeout(voiceWatchdog);
            challengeTimer = null;
            voiceWatchdog = null;
            activeChallenge = null; // Invalidate handlers before aborting recognition.
            isListening = false;
            try { recognition?.abort(); } catch (err) { console.warn(err); }
            if (challenge.element.classList.contains('hidden-state')) {
                setDirectionHidden(challenge.dirId, challenge.element);
            }
        }

        let typedDirectionId = null;
        const answerModal = document.getElementById('answer-modal');
        const answerInput = document.getElementById('answer-input');
        const answerFeedback = document.getElementById('answer-feedback');
        function openAnswerModal(dirId) {
            typedDirectionId = dirId;
            answerInput.value = '';
            answerFeedback.textContent = '';
            answerModal.hidden = false;
            answerInput.focus();
        }
        function closeAnswerModal() {
            answerModal.hidden = true;
            typedDirectionId = null;
        }
        document.getElementById('answer-form').addEventListener('submit', event => {
            event.preventDefault();
            if (!typedDirectionId) return;
            if (checkMatch(answerInput.value, typedDirectionId)) {
                const el = document.getElementById(`dir-${typedDirectionId}`);
                setDirectionVisible(typedDirectionId, el);
                setSpeechStatus('鍵盤答案正確');
                showToast('答對了！');
                closeAnswerModal();
            } else {
                answerFeedback.textContent = '答錯了，請再試一次。';
                answerInput.select();
            }
        });
        document.getElementById('answer-reveal').addEventListener('click', () => {
            if (typedDirectionId) {
                setDirectionVisible(typedDirectionId, document.getElementById(`dir-${typedDirectionId}`));
            }
            closeAnswerModal();
        });
        document.getElementById('answer-cancel').addEventListener('click', closeAnswerModal);
        answerModal.addEventListener('click', event => {
            if (event.target === answerModal) closeAnswerModal();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !answerModal.hidden) closeAnswerModal();
        });

        function hideRandomDirections(count) {
            cancelVoiceChallenge();
            revealAll();
            const shuffled = [...directions];
            // Fisher-Yates: unbiased shuffle (unlike Array.sort(() => Math.random() - 0.5)).
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const safeCount = Math.max(0, Math.min(shuffled.length, Number(count) || 0));
            shuffled.slice(0, safeCount).forEach(dir => {
                setDirectionHidden(dir.id, document.getElementById(`dir-${dir.id}`));
            });
            showToast(`已隨機隱藏 ${safeCount} 個方向`);
        }

        function revealAll() {
            cancelVoiceChallenge();
            directions.forEach(dir => {
                setDirectionVisible(dir.id, document.getElementById(`dir-${dir.id}`));
            });
        }

        function hideSelectedCount() {
            hideRandomDirections(Number(document.getElementById('hide-count').value));
        }

        // Match complete answers rather than substrings: "west" must never match "e".
        function checkMatch(spokenText, dirId) {
            if (typeof spokenText !== 'string') return false;
            const answer = spokenText.normalize('NFKC').toLowerCase()
                .replace(/[\s\u3000.,!?，。！？、:;；'’"“”「」『』()（）_\-/]+/g, '')
                .replace(/^(?:我猜|答案是|係|系|是)/, '')
                .replace(/(?:方向|方位|方|邊|边|面)$/, '');
            const acceptable = {
                N: ['北', '正北', 'north', 'n'],
                NE: ['東北', '东北', 'northeast', 'ne'],
                E: ['東', '东', '正東', '正东', 'east', 'e'],
                SE: ['東南', '东南', 'southeast', 'se'],
                S: ['南', '正南', 'south', 's'],
                SW: ['西南', 'southwest', 'sw'],
                W: ['西', '正西', 'west', 'w'],
                NW: ['西北', 'northwest', 'nw']
            };
            return (acceptable[dirId] || []).includes(answer);
        }

        function startVoiceChallenge(dirId, element) {
            if (!recognition || activeChallenge) return;
            const challenge = { dirId, element, resolved: false };
            activeChallenge = challenge;
            isListening = true;
            element.classList.remove('error', 'success');
            element.classList.add('hidden-state', 'listening');
            recognition.lang = document.getElementById('lang-select').value;
            setSpeechStatus('正在啟動辨識…');
            showToast('請說出方向（聆聽中…）');
            recognition.onstart = () => {
                if (activeChallenge === challenge) setSpeechStatus('已啟動，請說出方向');
            };
            recognition.onaudiostart = () => {
                if (activeChallenge === challenge) setSpeechStatus('咪高峰收音中…');
            };

            recognition.onresult = event => {
                if (activeChallenge !== challenge || challenge.resolved) return;
                challenge.resolved = true;
                const transcript = event.results?.[0]?.[0]?.transcript || '';
                element.classList.remove('listening');
                if (checkMatch(transcript, dirId)) {
                    element.classList.add('success');
                    setSpeechStatus(`已識別：「${transcript}」— 正確`);
                    showToast(`正確！(${transcript})`);
                    challengeTimer = setTimeout(() => {
                        if (activeChallenge !== challenge) return;
                        setDirectionVisible(dirId, element);
                        finishChallenge(challenge);
                    }, 800);
                } else {
                    element.classList.add('error');
                    setSpeechStatus(`已識別：「${transcript || '空白'}」— 答錯`);
                    showToast(`再試一次，聽到：「${transcript || '（沒有回答）'}」`);
                    challengeTimer = setTimeout(() => {
                        if (activeChallenge !== challenge) return;
                        setDirectionHidden(dirId, element);
                        finishChallenge(challenge);
                    }, 1000);
                }
            };

            recognition.onerror = event => {
                if (activeChallenge !== challenge || challenge.resolved) return;
                challenge.resolved = true;
                const code = event.error || 'unknown';
                console.warn('Speech recognition error:', code, event.message || '');
                setDirectionHidden(dirId, element);
                finishChallenge(challenge);
                const messages = {
                    'not-allowed': '未獲麥克風／語音辨識權限',
                    'service-not-allowed': '瀏覽器或 Siri 語音服務不允許',
                    'language-not-supported': '此語言未受辨識服務支援，請試其他語言',
                    'language-unavailable': '此語言暫時不可用',
                    'audio-capture': '找不到咪高峰或無法收音',
                    'network': '語音服務網絡錯誤',
                    'no-speech': '未偵測到聲音，請再試一次',
                    'aborted': '辨識已停止'
                };
                const message = messages[code] || `語音辨識錯誤：${code}`;
                const hardFailure = ['not-allowed', 'service-not-allowed',
                    'language-not-supported', 'language-unavailable',
                    'audio-capture', 'network'].includes(code);
                if (hardFailure) {
                    voiceMode = false;
                    typeMode = true;
                    updateVoiceBtnUI();
                    setSpeechStatus(`${message}，已改用鍵盤（Safari 請啟用 Siri）`);
                    showToast('語音不可用，請輸入方向答案');
                    openAnswerModal(dirId);
                } else {
                    setSpeechStatus(message);
                    showToast(message);
                }
            };

            recognition.onend = () => {
                if (activeChallenge !== challenge || challenge.resolved) return;
                challenge.resolved = true;
                setDirectionHidden(dirId, element);
                finishChallenge(challenge);
                setSpeechStatus('沒有聽到回答，請再試一次');
                showToast('沒有聽到回答，請再試一次');
            };

            try {
                recognition.start();
                // Some embedded iPad browsers expose the API but never start it.
                voiceWatchdog = setTimeout(() => {
                    if (activeChallenge !== challenge || challenge.resolved) return;
                    challenge.resolved = true;
                    setDirectionHidden(dirId, element);
                    finishChallenge(challenge);
                    try { recognition.abort(); } catch (_) {}
                    voiceMode = false;
                    typeMode = true;
                    updateVoiceBtnUI();
                    setSpeechStatus('辨識沒有回應，請改用 Safari 並啟用 Siri；目前可用鍵盤回答');
                    openAnswerModal(dirId);
                }, 18000);
            } catch (err) {
                console.warn('Could not start speech recognition:', err);
                setDirectionHidden(dirId, element);
                finishChallenge(challenge);
                voiceMode = false;
                typeMode = true;
                updateVoiceBtnUI();
                setSpeechStatus(`無法啟動辨識：${err?.name || 'unknown'}，改用鍵盤`);
                openAnswerModal(dirId);
            }
        }

        function updateRotation(angle) {
            if (!Number.isFinite(angle)) return;
            compassRotation = angle;
            compassEl.style.transform = `rotate(${compassRotation}deg)`;
            document.querySelectorAll('.direction-point').forEach(element => {
                element.style.transform = `translate(-50%, -50%) rotate(${-compassRotation}deg)`;
            });
        }

        function getAngleFromEvent(event) {
            const rect = compassEl.getBoundingClientRect();
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            return Math.atan2(clientY - (rect.top + rect.height / 2),
                              clientX - (rect.left + rect.width / 2)) * 180 / Math.PI;
        }

        function startDrag(event) {
            if (gyroMode || (event.button !== undefined && event.button !== 0) ||
                (event.touches && event.touches.length !== 1)) return;
            clearTimeout(dragResetTimer);
            isDragging = true;
            hasDragged = false;
            dragTravel = 0;
            previousDragAngle = getAngleFromEvent(event);
        }

        function drag(event) {
            if (!isDragging || gyroMode || (event.touches && event.touches.length !== 1)) return;
            if (event.cancelable) event.preventDefault();
            const currentAngle = getAngleFromEvent(event);
            // Use an incremental, wrapped delta to avoid a jump across +/-180 degrees.
            const delta = ((currentAngle - previousDragAngle + 540) % 360) - 180;
            previousDragAngle = currentAngle;
            dragTravel += Math.abs(delta);
            if (dragTravel > 3) hasDragged = true;
            updateRotation(compassRotation + delta);
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            clearTimeout(dragResetTimer);
            dragResetTimer = setTimeout(() => { hasDragged = false; }, 100);
        }

        compassEl.addEventListener('mousedown', startDrag);
        compassEl.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
        window.addEventListener('touchcancel', endDrag);
        window.addEventListener('blur', endDrag);

        function disableGyro() {
            gyroMode = false;
            clearTimeout(gyroReadTimer);
            window.removeEventListener('deviceorientation', handleOrientation);
            window.removeEventListener('deviceorientationabsolute', handleOrientation);
            gyroBtn.textContent = '手動 (Manual)';
            gyroBtn.classList.replace('bg-purple-500', 'bg-gray-500');
            gyroBtn.setAttribute('aria-pressed', 'false');
            updateRotation(0);
        }

        function handleOrientation(event) {
            if (!gyroMode) return;
            let heading;
            if (Number.isFinite(event.webkitCompassHeading)) {
                heading = event.webkitCompassHeading;
            } else if ((event.absolute === true || event.type === 'deviceorientationabsolute') &&
                       Number.isFinite(event.alpha)) {
                heading = 360 - event.alpha;
            } else {
                return; // Relative orientation is NOT a reliable north bearing.
            }
            gyroHasReading = true;
            clearTimeout(gyroReadTimer);
            updateRotation(-heading);
        }

        gyroBtn.addEventListener('click', async () => {
            if (gyroMode) {
                disableGyro();
                return;
            }
            if (!('ondeviceorientation' in window) && !('ondeviceorientationabsolute' in window)) {
                showToast('此瀏覽器不支持裝置方向感應');
                return;
            }
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    // iOS requires this request inside a user click.
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        showToast('沒有裝置方向感應權限');
                        return;
                    }
                } catch (err) {
                    console.warn('Orientation permission error:', err);
                    showToast('無法啟用裝置方向感應');
                    return;
                }
            }
            gyroMode = true;
            gyroHasReading = false;
            gyroBtn.textContent = '陀螺儀 (Gyro)';
            gyroBtn.classList.replace('bg-gray-500', 'bg-purple-500');
            gyroBtn.setAttribute('aria-pressed', 'true');
            // Both listeners are safe; only usable north-referenced readings are applied.
            window.addEventListener('deviceorientationabsolute', handleOrientation);
            window.addEventListener('deviceorientation', handleOrientation);
            gyroReadTimer = setTimeout(() => {
                if (gyroMode && !gyroHasReading) {
                    disableGyro();
                    showToast('無法取得羅盤方向，已返回手動模式');
                }
            }, 3500);
            showToast('已啟用裝置方向（精度取決於裝置校準）');
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function updateVoiceBtnUI() {
            voiceBtn.textContent = voiceMode ? 'ON' : typeMode ? '輸入' : 'OFF';
            voiceBtn.classList.toggle('bg-green-500', voiceMode);
            voiceBtn.classList.toggle('hover:bg-green-600', voiceMode);
            voiceBtn.classList.toggle('bg-gray-500', !voiceMode);
            voiceBtn.classList.toggle('hover:bg-gray-600', !voiceMode);
            voiceBtn.setAttribute('aria-pressed', String(voiceMode));
            directions.forEach(dir => {
                const element = document.getElementById(`dir-${dir.id}`);
                if (element?.classList.contains('hidden-state') &&
                    !element.classList.contains('listening')) {
                    setDirectionHidden(dir.id, element);
                }
            });
        }

        document.getElementById('use-keyboard-btn').addEventListener('click', () => {
            cancelVoiceChallenge();
            voiceMode = false;
            typeMode = true;
            updateVoiceBtnUI();
            setSpeechStatus('鍵盤模式：點擊隱藏方向後輸入答案');
        });

        voiceBtn.addEventListener('click', () => {
            cancelVoiceChallenge();
            if (!recognition) {
                typeMode = !typeMode;
                setSpeechStatus(typeMode ? '此瀏覽器不支援語音，改為鍵盤回答' : '手動顯示答案');
            } else if (voiceMode) {
                voiceMode = false;
                typeMode = false;
                setSpeechStatus('關閉（點方向直接顯示答案）');
            } else {
                voiceMode = true;
                typeMode = false;
                setSpeechStatus('準備就緒；請點隱藏方向開始辨識');
            }
            updateVoiceBtnUI();
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            if (started) return;
            started = true;
            const overlay = document.getElementById('start-screen');
            overlay.style.opacity = '0';
            // Don't block the game on a camera permission prompt or rejection.
            initCamera();
            setTimeout(() => {
                overlay.style.display = 'none';
                hideSelectedCount();
                if (!recognition) showToast('此瀏覽器不支援語音，已切換鍵盤回答');
            }, 500);
        });

        // Stop the camera when navigating away, including when the tab is closed.
        window.addEventListener('pagehide', stopCamera);
        window.addEventListener('pageshow', event => {
            if (event.persisted && started) setCameraStatus('頁面已恢復，請按重試', true);
        });

        // Script is at the end of <body>; nodes are ready and no network is required.
        initCompass();
        updateVoiceBtnUI();
        setSpeechStatus(recognition
            ? '已支援，點隱藏方向開始（iPad Safari 需啟用 Siri）'
            : '此瀏覽器未提供辨識功能，可用鍵盤回答');
    </script>
</body>
</html>
